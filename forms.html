<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Data Form Survey Perokok</title>
    <meta name="description" content="Data yang sudah terkumpul dari Form Survey perokok">
    <link rel='stylesheet' href='forms.css'>
</head>

<body class="min-h-screen bg-indigo-50 font-sans">
    <main class="container container max-w-2xl py-2 px-4 m-auto">
        <article>
            <h1 class="text-3xl relative overflow-hidden rounded-lg bg-[white] border-[1px] px-8 py-4">
                <div class="bg-indigo-600 absolute inset-0 h-2"></div>
                Data Form Survey Perokok
            </h1>
            <div class="border-[1px] rounded-lg overflow-hidden bg-[white] mt-3">
                <table class="[&_td]:p-2 [&_th]:p-2 [&_tr>*]:text-center [&_tr>*]:text-sm table-auto">
                    <thead
                        class="bg-indigo-600 text-[white] [&_th:not(:first-child)]:border-s-[1px] [&_th:not(:last-child)]:border-e-[1px]">
                        <tr>
                            <th scope="col" rowspan="2">Nama</th>
                            <th scope="col" rowspan="2">Umur</th>
                            <th scope="col" rowspan="2">Sex</th>
                            <th scope="col" rowspan="2">Perokok</th>
                            <th scope="colgroup" colspan="4">Rokok pernah dicoba</th>
                            <th scope="col" rowspan="2">Tanggal Kirim Form</th>
                        </tr>
                        <tr class="*:border-t-[1px]">
                            <th scope="col">Gudang Garam Filter</th>
                            <th scope="col">Lucky Strike</th>
                            <th scope="col">Marlboro</th>
                            <th scope="col">Esse</th>
                        </tr>
                    </thead>
                    <tbody
                        class="[&>*:nth-child(even)]:bg-indigo-100 [&_tr>*:not(:first-child)]:border-s-[1px] [&_tr>*]:border-[rgba(0,0,0,0.2)]">
                    </tbody>
                </table>
            </div>
            <footer>
                <a href="/index.html" class="font-medium text-indigo-600 underline">&larr; Kembali ke Form Survey
                    Perkokok</a>
            </footer>
        </article>
    </main>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <script>
        const data = JSON.parse(localStorage.getItem("entries")) || []
        const tbodyEl = document.querySelector("tbody")

        function renderRow({ name, age, sex, smoker, brand, createdAt }) {
            const trEl = document.createElement("tr")
            const nameEl = document.createElement("th")
            nameEl.scope = "row"
            nameEl.textContent = name

            const ageEl = document.createElement("td")
            ageEl.textContent = age

            const sexEl = document.createElement("td")
            sexEl.textContent = sex === "male" ? "Laki-laki" : "Perempuan"

            const smokerEl = document.createElement("td")
            smokerEl.textContent = smoker ? "✓" : ""

            const filterEl = document.createElement("td")
            filterEl.textContent = brand.includes("filter") ? "✓" : ""

            const lsEl = document.createElement("td")
            lsEl.textContent = brand.includes("ls") ? "✓" : ""

            const mbEl = document.createElement("td")
            mbEl.textContent = brand.includes("mb") ? "✓" : ""

            const esseEl = document.createElement("td")
            esseEl.textContent = brand.includes("esse") ? "✓" : ""

            const submitedAtEl = document.createElement("td")
            submitedAtEl.textContent = new Date(Number(createdAt)).toLocaleDateString("id-ID")

            trEl.append(nameEl, ageEl, sexEl, smokerEl, filterEl, lsEl, mbEl, esseEl, submitedAtEl)

            return trEl
        }

        data.forEach(({ name, age, sex, smoker, brand, createdAt }) => {
            tbodyEl.appendChild(renderRow({ name, age, sex, smoker, brand, createdAt }))
        })
    </script>
</body>

</html>
