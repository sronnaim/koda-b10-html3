<!DOCTYPE html>
<html lang='id'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name="description" content="Form khusus untuk perokok">
    <title>Form Survey Perokok</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <main>
        <article class="form">
            <header>
                <h1>Survey Perokok</h1>
                <p>Form survey pendataan perokok</p>
            </header>
            <form action="/index.html">
                <div>
                    <label for="name">Siapa nama Anda?</label>
                    <div>
                        <input id="name" name="name" placeholder="Nama lengkap..." type="text" />
                    </div>
                </div>

                <div>
                    <label for="age">Berapa umur Anda?</label>
                    <div>
                        <input id="age" name="age" placeholder="Umur..." type="number"/>
                    </div>
                </div>

                <div>
                    <label for="sex-m">Apa jenis kelamin Anda?</label>

                    <div>
                        <input type="radio" name="sex" value="male" id="sex-m"/>
                        <label for="sex-m">Laki-laki</label>
                    </div>
                    <div>
                        <input type="radio" name="sex" value="female" id="sex-f"/>
                        <label for="sex-f">Perempuan</label>
                    </div>
                </div>

                <div>
                    <label for="smoker-y">Apa Anda perokok?</label>

                    <div>
                        <input type="radio" name="smoker" value="true" id="smoker-y"/>
                        <label for="smoker-y">Ya</label>
                    </div>

                    <div>
                        <input type="radio" name="smoker" value="false" id="smoker-n"/>
                        <label for="smoker-n">Tidak</label>
                    </div>
                </div>

                <div>
                    <label for="brand-filter">Jika anda perokok, rokok apa yang Anda pernah coba?</label>
                    
                    <div>
                        <input type="checkbox" name="brand" value="filter" id="brand-filter" />
                        <label for="brand-filter">Gudang Garam Filter</label>
                    </div>
                    <div>
                        <input type="checkbox" name="brand" value="ls" id="brand-ls" />
                        <label for="brand-ls">Lucky Strike</label>
                    </div>
                    <div>
                        <input type="checkbox" name="brand" value="mb" id="brand-mb" />
                        <label for="brand-mb">Marlboro</label>
                    </div>
                    <div>
                        <input type="checkbox" name="brand" value="esse" id="brand-esse" />
                        <label for="brand-esse">Esse</label>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit">Kirim Form</button>
                    <button type="reset">Reset</button>
                </div>
            </form>
            <footer>
                <a href="/forms.html">Lihat data form yang terkirim &rarr;</a>
            </footer>
        </article>
    </main>
</body>
</html>
