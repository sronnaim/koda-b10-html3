<!DOCTYPE html>
<html lang='id'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name="description" content="Form khusus untuk perokok">
    <title>Form Survey Perokok</title>
</head>

<body class="min-h-screen bg-indigo-50 font-sans">
    <main class="container max-w-2xl py-2 px-4 m-auto">
        <article class="form flex flex-col gap-3">
            <header class="relative overflow-hidden rounded-lg bg-[white] border-[1px] *:px-8 py-4">
                <div class="bg-indigo-600 absolute inset-0 h-2"></div>
                <h1 class="text-3xl mb-3">Survey Perokok</h1>
                <p class="pt-3 border-t-[1px]">Form survey pendataan perokok</p>
            </header>
            <form action="./index.html"
                class="[&>:not(:last-child)]:border-[1px] [&>:not(:last-child)]:p-8 [&>:not(:last-child)]:rounded-lg flex flex-col gap-3 [&>:not(:last-child)]:bg-[white] [&>:not(:last-child)]:flex [&>:not(:last-child)]:flex-col [&>:not(:last-child)]:gap-4 [&_input]:outline-none [&_input]:border-b-[1px] [&_input]:bg-[transparent]">
                <div>
                    <label for="name">Siapa nama Anda?</label>
                    <div>
                        <input class="min-w-[30ch]" required="true" pattern="/^[a-z ,.'-]+$/i" id="name" name="name"
                            placeholder="Nama lengkap..." type="text" autocomplete="name" />
                    </div>
                </div>

                <div>
                    <label for="age">Berapa umur Anda?</label>
                    <div>
                        <input class="min-w-[30ch]" required="true" id="age" name="age" min="10" max="110"
                            placeholder="Umur..." type="number" />
                    </div>
                </div>

                <div>
                    <label for="sex-m">Apa jenis kelamin Anda?</label>

                    <div>
                        <input required="true" type="radio" name="sex" value="male" id="sex-m" />
                        <label for="sex-m">Laki-laki</label>
                    </div>
                    <div>
                        <input type="radio" name="sex" value="female" id="sex-f" />
                        <label for="sex-f">Perempuan</label>
                    </div>
                </div>

                <div>
                    <label for="smoker-y">Apa Anda perokok?</label>
                    <div>
                        <input required="true" type="radio" name="smoker" value="true" id="smoker-y" />
                        <label for="smoker-y">Ya</label>
                    </div>

                    <div>
                        <input type="radio" name="smoker" value="false" id="smoker-n" />
                        <label for="smoker-n">Tidak</label>
                    </div>
                </div>

                <div>
                    <label for="brand-filter">Jika anda perokok, rokok apa yang Anda pernah coba?</label>

                    <div>
                        <input type="checkbox" name="brand" value="filter" id="brand-filter" />
                        <label for="brand-filter">Gudang Garam Filter</label>
                    </div>
                    <div>
                        <input type="checkbox" name="brand" value="ls" id="brand-ls" />
                        <label for="brand-ls">Lucky Strike</label>
                    </div>
                    <div>
                        <input type="checkbox" name="brand" value="mb" id="brand-mb" />
                        <label for="brand-mb">Marlboro</label>
                    </div>
                    <div>
                        <input type="checkbox" name="brand" value="esse" id="brand-esse" />
                        <label for="brand-esse">Esse</label>
                    </div>
                </div>

                <div
                    class="button-group flex justify-between first:*:bg-indigo-600 first:*:text-[white] last:*:text-indigo-600 *:font-medium *:rounded *:px-8 *:py-2">
                    <button type="submit">Kirim Form</button>
                    <button type="reset">Reset</button>
                </div>
            </form>
            <footer>
                <a href="/forms.html" class="text-indigo-600 underline">Lihat data form yang terkirim &rarr;</a>
            </footer>
        </article>
    </main>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <script>
        const formEl = document.querySelector("form")

        formEl.addEventListener("submit", handleOnSubmit)

        function handleOnSubmit(e) {
            const data = JSON.parse(localStorage.getItem("entries")) || []

            const fd = new FormData(e.target)

            fd.set("createdAt", Date.now())

            const entry = Object.fromEntries(fd.entries())

            entry.brand = fd.getAll("brand")

            data.push(entry)

            localStorage.setItem("entries", JSON.stringify(data))
        }
    </script>
</body>

</html>
